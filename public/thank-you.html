<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank you | Helping Hands</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/thank-you.css">
  <script type="module" src="js/thank-you.js"></script>
</head>
<body>
  <main class="thank-you-page">
    <div class="card-panel">
      <img src="img/img-2.jpeg" alt="" width="150">
      <h1>Thank You!</h1>
      <p id="greeting">Your donation details have been submitted successfully.</p>

      <div class="code-box" id="code-box" hidden>
        <span class="code-label">Your donation code</span>
        <strong id="donation-code"></strong>
        <button type="button" class="copy-btn" id="copy-code" aria-label="Copy donation code">
          <i class="fa-regular fa-copy" aria-hidden="true"></i> <span>Copy</span>
        </button>
      </div>

      <p>We will get in touch with you soon to collect your donation. Keep the code above to follow its progress.</p>
      <a href="/track" class="btn1" id="track-link">Track my donation</a>
      <a href="/" class="btn-link">Back to home</a>

      <div class="social-icons">
        <a href="https://github.com/Raja9964" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
        <a href="https://www.linkedin.com/in/raja-mohamad-711161262" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
      </div>
    </div>
  </main>
</body>
</html>
