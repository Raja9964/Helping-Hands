<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track a donation | Helping Hands</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/track.css">
  <script type="module" src="js/track.js"></script>
</head>
<body>
  <a href="./" class="home-link">&larr; Helping Hands</a>
  <main class="container">
    <h1>Track your donation</h1>
    <p>Enter the donation code you received after submitting the form.</p>
    <form id="track-form" autocomplete="off">
      <label class="visually-hidden" for="code">Donation code</label>
      <input type="text" id="code" name="code" placeholder="e.g. HH-7K3P9Q" maxlength="12" spellcheck="false" required>
      <button type="submit">Track donation</button>
    </form>
    <section id="tracking-info" aria-live="polite" hidden></section>
  </main>
</body>
</html>
